<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Management System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <a class="login-logo" href="index.html" aria-label="Management System home">M</a>
    <h1>Welcome Back!</h1>
    <p class="login-subtitle">Sign in to continue to your account.</p>
    <form class="login-card" id="loginForm">
      <h2>Login to your account</h2>
      <p class="form-intro">Enter your email and password to get started.</p>
      <label for="email">Email Address</label>
      <input id="email" name="email" type="email"
       placeholder="name@example.com" required>
      <div class="password-label">
        <label for="password">Password</label>
        <button class="text-button" type="button" id="forgotPassword">Forgot password?</button>
      </div>
      <div class="password-field">
        <input id="password" name="password" type="password"
       placeholder="Enter your password" required minlength="4">
        <button class="show-password" type="button" id="togglePassword">Show</button>
      </div>
      <label class="remember-row"><input type="checkbox" id="remember"> <span>Remember me</span></label>
      <button class="sign-in-button" type="submit">Sign In</button>
      <p class="create-account">Don't have an account? <button type="button" class="text-button" id="createAccount">Create an account</button></p>
      <p class="form-message" id="formMessage" role="status"></p>
    </form>
    <p class="login-footer">© 2026 My Website. All rights reserved.</p>
  </main>
  <script src="js/script.js"></script>
</body>
</html>
